name: CI

on:
  push:
    branches: [main, 'feat/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/ms-playwright

jobs:
  test:
    name: Node ${{ matrix.node }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: '22'
          - os: ubuntu-latest
            node: '24'
          - os: macos-15
            node: '22'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Resolve locked Playwright version
        id: playwright
        run: echo "version=$(node -p "require('playwright-core/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Chromium
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}-chromium
      # Always install: a cache hit does not supply Linux system libraries.
      - name: Install Chromium and system dependencies
        run: node node_modules/playwright-core/cli.js install --with-deps chromium
      # Ubuntu restricts user namespaces for downloaded Chrome builds. Allow
      # this exact executable to create its sandbox on the disposable runner.
      # https://chromium.googlesource.com/chromium/src/+/main/docs/security/apparmor-userns-restrictions.md
      - name: Allow Chromium sandbox on Ubuntu
        if: runner.os == 'Linux'
        run: |
          chromium_path="$(node -p "require('playwright-core').chromium.executablePath()")"
          sudo tee /etc/apparmor.d/archbrowse-ci-chromium > /dev/null <<EOF
          abi <abi/4.0>,
          include <tunables/global>
          profile archbrowse-ci-chromium "$chromium_path" flags=(unconfined) {
            userns,
          }
          EOF
          sudo apparmor_parser -r /etc/apparmor.d/archbrowse-ci-chromium
      - name: Typecheck, unit tests, browser/PTY parity, sessions and agent control
        run: npm run check
      - name: Verify installed package and bundled skill
        run: npm run test:package
      - name: Install pinned HerdR
        if: matrix.node == '22'
        run: node scripts/install-ci-herdr.mjs
      - name: Test real HerdR graphics and input in a PTY
        if: matrix.node == '22'
        run: npm run test:herdr
      - name: Bootstrap ArchBrowse and test saved HerdR preferences
        if: matrix.node == '22'
        env:
          ARCHBROWSE_INSTALL_DIR: ${{ runner.temp }}/archbrowse-cli
          ARCHBROWSE_BIN_DIR: ${{ runner.temp }}/archbrowse-bin
        run: |
          node skills/archbrowse/scripts/bootstrap.mjs install --source "$GITHUB_WORKSPACE"
          npm run test:skill
      - name: Upload browser and terminal evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-pty-node-${{ matrix.node }}-${{ matrix.os }}
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 7
