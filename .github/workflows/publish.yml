name: Publish npm package

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: Validate and package without publishing
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Require a release commit from main and a matching tag
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
          const lock = JSON.parse(readFileSync('package-lock.json', 'utf8'));
          assert.equal(pkg.name, '@archastro/archbrowse');
          assert.equal(lock.version, pkg.version);
          assert.equal(lock.packages[''].version, pkg.version);
          assert.match(pkg.version, /^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$/);
          if (process.env.DRY_RUN !== 'true' || process.env.GITHUB_REF_TYPE === 'tag') {
            assert.equal(process.env.GITHUB_REF, `refs/tags/v${pkg.version}`, 'Publishing requires a tag matching package.json');
          }
          JS

  test:
    needs: validate
    uses: ./.github/workflows/ci.yml

  publish:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Pin npm with OIDC support
        run: npm install --global npm@11.19.0
      - run: npm ci --no-audit --no-fund
      - name: Build and pack
        run: |
          npm pack --json > package-result.json
          node -e 'const p=require("./package-result.json")[0];console.log("PACKAGE_ARCHIVE="+p.filename)' >> "$GITHUB_ENV"
          node -e 'const p=require("./package.json");console.log("DIST_TAG="+(p.version.includes("-")?"next":"latest"))' >> "$GITHUB_ENV"
      - name: Dry run
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        run: npm publish "$PACKAGE_ARCHIVE" --dry-run --ignore-scripts --access public --tag "$DIST_TAG" --registry=https://registry.npmjs.org
      # npm exchanges the GitHub OIDC identity for a short-lived credential.
      # Configure this exact workflow filename using `npm trust github`.
      - name: Publish with trusted publishing and provenance
        if: github.event_name != 'workflow_dispatch' || !inputs.dry_run
        run: npm publish "$PACKAGE_ARCHIVE" --ignore-scripts --access public --provenance --tag "$DIST_TAG" --registry=https://registry.npmjs.org
